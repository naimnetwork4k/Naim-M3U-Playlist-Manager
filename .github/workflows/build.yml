name: Build Website to APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Initialize Android Project
      run: |
        # একটি বেসিক অ্যান্ড্রয়েড প্রোজেক্ট স্ট্রাকচার তৈরি করা হচ্ছে
        mkdir -p app/src/main/java/com/naimnetwork/manager
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-xxhdpi

    - name: Create Build Configuration
      run: |
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1'
        }
        android {
            namespace 'com.naimnetwork.manager'
            compileSdk 34
            defaultConfig {
                applicationId "com.naimnetwork.manager"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

    - name: Create Strings (App Name)
      run: |
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Naim M3U Playlist Manager</string>
        </resources>
        EOF

    - name: Setup Webview Source Code
      run: |
        cat << 'EOF' > app/src/main/java/com/naimnetwork/manager/MainActivity.java
        package com.naimnetwork.manager;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.webkit.WebSettings;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                setContentView(webView);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("https://naimnetwork.com");
            }
        }
        EOF

    - name: Setup Android Manifest
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.INTERNET" />
            <application 
                android:label="@string/app_name" 
                android:icon="@mipmap/ic_launcher"
                android:usesCleartextTraffic="true">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Naim-M3U-Playlist-Manager-APK
        path: app/build/outputs/apk/debug/app-debug.apk
